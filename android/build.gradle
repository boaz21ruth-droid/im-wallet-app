buildscript { 
    repositories { 
        google() 
        mavenCentral()
    } 
    dependencies { 
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    } 
}

allprojects {
    afterEvaluate {
        if (project.hasProperty("android")) {
            android {
                compileSdk = 36
                if (!it.hasProperty("namespace") || it.namespace == null) {
                    namespace = project.group.toString()
                }
            }
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.21'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.21'
        }
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.set(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.set(newSubprojectBuildDir)
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
