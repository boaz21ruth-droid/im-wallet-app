<script>
        // Micro-interaction for chips
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                if (this.classList.contains('font-label-md')) {
                    const parent = this.parentElement;
                    parent.querySelectorAll('button').forEach(btn => {
                        btn.classList.remove('bg-primary-container', 'text-on-primary-container');
                        btn.classList.add('bg-surface-container', 'text-on-surface-variant');
                    });
                    this.classList.add('bg-primary-container', 'text-on-primary-container');
                    this.classList.remove('bg-surface-container', 'text-on-surface-variant');
                }
            });
        });
